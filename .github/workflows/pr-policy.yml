name: Toolmeet PR policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    steps:
      # Always run the validator from the trusted base commit, never from PR code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node scripts/check_pr_workflow.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
